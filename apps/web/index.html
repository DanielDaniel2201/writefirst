<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Say what you truly want to say first, then see how to say it in your target language."
    />
    <title>Write First</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="landing-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Write First home">
          <span class="brand-icon" aria-hidden="true">W</span>
          <span>Write First</span>
        </a>

        <button class="language-switch" type="button" data-language-switch>中文版</button>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <h1 class="hero-title" id="hero-title">
          <span data-copy="headlineLead">Say what you truly want to say first,</span>
          <span class="hero-title-line">
            <span data-copy="headlineBridge">then see</span>
            <span class="demo-field" aria-hidden="true">
              <span data-copy="demoText">how to say it in your target language</span>
              <span class="typing-caret"></span>
            </span>
          </span>
        </h1>

        <div class="translation-card" role="img" aria-label="Write First translation card preview">
          <span data-copy="cardText">用你的目标语言怎么说</span>
        </div>

        <div class="install-block">
          <a
            class="download-button"
            href="/downloads/write-first-extension.zip"
            download="write-first-extension.zip"
            data-download-link
          >
            <span data-copy="cta">Add to Chrome</span>
          </a>

          <p class="install-hint" data-copy="installHint">
            <span>Download &amp; unzip</span>
            <i aria-hidden="true"></i>
            <span>Open chrome://extensions</span>
            <i aria-hidden="true"></i>
            <span>Load unpacked</span>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
