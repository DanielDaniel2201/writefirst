<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Write First 是一个安静的 Chrome 写作旁注。先表达真正想说的话，再看目标语言怎么说。"
    />
    <title>Write First</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-nav" aria-label="主导航">
        <a class="brand-mark" href="/" aria-label="Write First 首页">Write First</a>
        <nav class="nav-links">
          <a href="#principle">理念与场景</a>
          <a href="/install/">安装</a>
        </nav>
      </header>

      <main>
        <section class="split-section hero" id="top">
          <div class="split-copy hero-copy">
            <div class="copy-block">
              <h1>Write First</h1>
              <p class="lede">先表达真正想说的话，再看目标语言怎么说。</p>
              <a class="text-link" href="/install/">安装扩展</a>
            </div>
          </div>

          <div class="split-visual hero-visual" aria-label="Write First 输入旁注示意">
            <div class="input-stage" aria-hidden="true">
              <div class="input-canvas">
                <span class="mock-label">搜索框</span>
                <p class="mock-input">怎么表达这个意思…</p>
              </div>
              <div class="translation-note">
                <span>翻译旁注</span>
                <p>How to express this idea...</p>
              </div>
            </div>
          </div>
        </section>

        <section class="split-section principle" id="principle">
          <div class="split-copy principle-copy">
            <div class="copy-block copy-block--wide">
              <p class="eyebrow">理念与场景</p>
              <h2>不是代写，而是把你刚想说的话翻译给你看。</h2>
              <p class="lede">
                输入停止 800ms 后，旁注卡片自然出现。不抢焦点，不替换文本。
              </p>

              <div class="scenario-list">
                <article>
                  <h3>搜索框</h3>
                  <p>先用母语写问题，再对照目标语言怎么组织关键词。</p>
                </article>
                <article>
                  <h3>评论与社交</h3>
                  <p>想回复时，旁边出现更自然的说法，从看懂慢慢转向会说。</p>
                </article>
                <article>
                  <h3>笔记与草稿</h3>
                  <p>用自己最熟悉的内容，积累真正会在生活里使用的表达。</p>
                </article>
              </div>
            </div>
          </div>

          <div class="split-visual clock-stage" aria-label="输入停止 800 毫秒后出现旁注">
            <div class="clock" aria-hidden="true">
              <i class="clock-mark clock-mark--top"></i>
              <i class="clock-mark clock-mark--right"></i>
              <i class="clock-mark clock-mark--bottom"></i>
              <i class="clock-mark clock-mark--left"></i>
              <span class="clock-hand"></span>
              <span class="clock-pin"></span>
            </div>
            <p class="clock-caption">800ms 后出现</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
