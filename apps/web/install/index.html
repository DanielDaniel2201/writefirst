<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="下载 Write First Chrome 扩展包，并按步骤完成安装。"
    />
    <title>Install Write First</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="page page--install">
      <section class="copy">
        <div class="title-row">
          <h1>下载并安装</h1>
          <a class="button" href="/downloads/write-first-extension.zip" download data-download-link>
            下载安装包
          </a>
        </div>
        <ol class="guide">
          <li>下载并解压 <code>write-first-extension.zip</code></li>
          <li>打开 <code>chrome://extensions</code>，开启 Developer mode</li>
          <li>点击 Load unpacked，选择解压后包含 <code>manifest.json</code> 的目录</li>
          <li>打开扩展，设置语言、base URL、model 和 API Key</li>
        </ol>
      </section>

      <section class="media" aria-label="Write First settings screenshot">
        <div class="frame">
          <img
            class="shot"
            src="/media/popup-settings.svg"
            alt="Write First 设置界面截图"
          />
        </div>
      </section>
    </main>
  </body>
</html>
