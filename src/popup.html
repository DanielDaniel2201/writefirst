<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Write First</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Write First</h1>
        <label class="switch">
          <input id="enabled" type="checkbox" />
          <span>Enabled</span>
        </label>
      </header>

      <form id="settings-form">
        <label>
          Native language
          <input id="sourceLanguage" name="sourceLanguage" autocomplete="off" />
        </label>

        <label>
          Target language
          <input id="targetLanguage" name="targetLanguage" autocomplete="off" />
        </label>

        <label class="range-field">
          <span class="range-field__header">
            Translation delay
            <output id="idleDelayValue" for="idleDelay">0.8s</output>
          </span>
          <input id="idleDelay" name="idleDelay" type="range" min="800" max="1500" step="100" />
          <span class="range-field__scale" aria-hidden="true">
            <span>0.8s</span>
            <span>1.5s</span>
          </span>
        </label>

        <label>
          API base URL
          <input id="baseUrl" name="baseUrl" inputmode="url" autocomplete="off" />
        </label>

        <label>
          Model
          <input id="model" name="model" autocomplete="off" />
        </label>

        <label class="checkbox-field">
          <input id="thinkingEnabled" name="thinkingEnabled" type="checkbox" />
          <span>Enable thinking</span>
        </label>

        <label>
          API key
          <input id="apiKey" name="apiKey" type="password" autocomplete="off" />
        </label>

        <button type="submit">Save</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
